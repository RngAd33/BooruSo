server:
  port: 8081
  servlet:
    context-path: /api
    session:
      cookie:
        domain: localhost
  # Tomcat 连接超时
  tomcat:
    connection-timeout: 10000

# 异步任务配置
spring:
  task:
    execution:
      pool:
        core-size: 4
        max-size: 16
        queue-capacity: 100
        keep-alive: 60s
      thread-name-prefix: async-http-

knife4j:
  enable: true
  setting:
    language: zh-CN
  openapi:
    title: BooroSo接口文档
    group:
      default:
        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.rngad33.booruso.controller
